# nginx site for a Unity Web (WebGL) build.
# From claude-unity-devkit templates/deploy/nginx-unity-webgl.conf; the compression blocks follow
# the Unity 6.3 manual, "Server configuration code samples" (Nginx).
#
# Install on the Droplet:
#   sudo cp nginx-unity-webgl.conf /etc/nginx/sites-available/unity-webgl.conf
#   sudo ln -s /etc/nginx/sites-available/unity-webgl.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d game.example.com     # adds the 443 listener + redirect
#
# Browsers only decode Brotli (Content-Encoding: br) over HTTPS. A Brotli build served over plain
# HTTP fails to load: either finish the certbot step or build with Gzip compression.
#
# Caching: every block sends Cache-Control "no-cache" (revalidate with ETag), so a deploy is
# visible immediately. If Publishing Settings -> "Name Files As Hashes" is on, the Build/ files may
# instead be cached for a year — see the commented line in each block.

server {
    listen 80;
    listen [::]:80;
    server_name game.example.com; # TAILOR

    # DEPLOY_ROOT/current — the symlink deploy.sh swaps on every release.
    root /var/www/unity-webgl/current; # TAILOR
    index index.html;

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";

        # On-disk Brotli-precompressed data files should be served with compression enabled:
        location ~ .+\.(data|symbols\.json)\.br$ {
            gzip off;
            add_header Content-Encoding br;
            add_header Cache-Control "no-cache";
            # add_header Cache-Control "public, max-age=31536000, immutable"; # hashed file names only
            default_type application/octet-stream;
        }

        # On-disk Brotli-precompressed JavaScript code files:
        location ~ .+\.js\.br$ {
            gzip off;
            add_header Content-Encoding br;
            add_header Cache-Control "no-cache";
            default_type application/javascript;
        }

        # On-disk Brotli-precompressed WebAssembly files:
        location ~ .+\.wasm\.br$ {
            gzip off;
            add_header Content-Encoding br;
            add_header Cache-Control "no-cache";
            default_type application/wasm;
        }

        # On-disk gzip-precompressed data files should be served with compression enabled:
        location ~ .+\.(data|symbols\.json)\.gz$ {
            gzip off;
            add_header Content-Encoding gzip;
            add_header Cache-Control "no-cache";
            default_type application/gzip;
        }

        # On-disk gzip-precompressed JavaScript code files:
        location ~ .+\.js\.gz$ {
            gzip off;
            add_header Content-Encoding gzip;
            add_header Cache-Control "no-cache";
            default_type application/javascript;
        }

        # On-disk gzip-precompressed WebAssembly files:
        location ~ .+\.wasm\.gz$ {
            gzip off;
            add_header Content-Encoding gzip;
            add_header Cache-Control "no-cache";
            default_type application/wasm;
        }

        # Uncompressed builds (Compression Format: Disabled): make sure .wasm gets its MIME type
        # even on nginx builds whose mime.types predates application/wasm.
        location ~ .+\.wasm$ {
            types { }
            default_type application/wasm;
            add_header Cache-Control "no-cache";
        }

        # Uncomment if built with "Enable Native C/C++ Multithreading":
        # location ~ .+\.(htm|html|js|js\.gz|js\.br)$ {
        #     add_header Cross-Origin-Opener-Policy same-origin;
        #     add_header Cross-Origin-Embedder-Policy require-corp;
        #     add_header Cross-Origin-Resource-Policy cross-origin;
        # }

        # Uncomment to allow CORS requests:
        # add_header Access-Control-Allow-Origin *;
    }

    # Uncompressed text assets (index.html, TemplateData/*.css) — safe to gzip on the fly.
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
}
